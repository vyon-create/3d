<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Keys</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #msg { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.75); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  </style>
  <script src="https://cloudflare.com"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
</head>
<body>
  <div id="msg">Starting 3D...</div>
  <script>
    const msg = document.getElementById('msg');
    if (typeof THREE === 'undefined') {
      msg.textContent = 'Error: Three.js blocked on this network.';
    } else {
      msg.textContent = 'Downloading keys.glb...';
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
      camera.position.set(0, 0.5, 4);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enableZoom = false;

      scene.add(new THREE.AmbientLight(0xffffff, 2.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      let mixer;
      let loadedModel;
      const clock = new THREE.Clock();

      const loader = new THREE.GLTFLoader();
      loader.load(
        './keys.glb',
        function (gltf) {
          msg.style.display = 'none';
          const model = gltf.scene;
          scene.add(model);

          model.updateMatrixWorld(true);
          const box = new THREE.Box3();
          model.traverse(function (child) {
            if (child.isMesh) {
              child.geometry.computeBoundingBox();
              const childBox = child.geometry.boundingBox.clone().applyMatrix4(child.matrixWorld);
              box.union(childBox);
            }
          });

          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z) || 1;
          const scale = 2.6 / maxDim;

          const pivot = new THREE.Group();
          model.scale.setScalar(scale);
          model.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
          pivot.add(model);
          scene.add(pivot);
          loadedModel = pivot;

          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach(function (clip) {
              mixer.clipAction(clip).play();
            });
          }
        },
        function (xhr) {
          if (xhr.total) {
            msg.textContent = 'Downloading keys: ' + Math.round((xhr.loaded / xhr.total) * 100) + '%';
          }
        },
        function (err) {
          msg.textContent = 'Load error: ' + (err.message || 'Could not load keys.glb');
        }
      );

      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);
        if (loadedModel) loadedModel.rotation.y += 0.005;
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }
  </script>
</body>
</html>
