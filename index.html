<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Diagnostic</title>
  <style>
    body { margin: 0; font-family: sans-serif; overflow: hidden; }
    #status { position: fixed; top: 10px; left: 10px; background: #111; color: #0f0; padding: 10px; border-radius: 6px; z-index: 99; max-width: 90%; }
  </style>
</head>
<body>
  <div id="status">Loading 3D engine...</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com",
        "three/addons/": "https://unpkg.com"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const status = document.getElementById('status');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 3));

    // Test cube to verify WebGL works
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.5, 0.5),
      new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true })
    );
    cube.position.set(-1.5, 0, 0);
    scene.add(cube);

    status.textContent = 'WebGL active. Downloading keys.glb...';

    const loader = new GLTFLoader();
    loader.load(
      'https://githubusercontent.com',
      (gltf) => {
        status.textContent = 'SUCCESS! Keys loaded.';
        scene.remove(cube);
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const scale = 2.5 / (Math.max(size.x, size.y, size.z) || 1);
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));
        scene.add(model);
      },
      (xhr) => {
        if (xhr.total) status.textContent = `Downloading: ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
      },
      (err) => {
        status.style.color = '#ff5555';
        status.textContent = 'ERROR: ' + (err.message || err);
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.y += 0.02;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
